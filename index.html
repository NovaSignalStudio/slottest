<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Infinity Slots, minigioco slot in stile Habbo/Nitro con jackpot validabile server-side."
    />
    <title>Infinity Slots</title>
    <link rel="preload" href="assets/infinity-logo-symbol.png" as="image" />
    <link rel="preload" href="assets/diamond.svg" as="image" />
    <link rel="stylesheet" href="styles.css?v=server-ready-1" />
  </head>
  <body>
    <main class="slot-widget" aria-label="Infinity Slots">
        <section class="slot-cabinet" id="slotMachine" aria-label="Infinity slot machine">
          <div class="cabinet-glow" aria-hidden="true"></div>

          <div class="slot-title">
            <span>Infinity</span>
            <img src="assets/infinity-logo-symbol.png" alt="Infinity" />
            <strong>Slots</strong>
          </div>

          <div class="paytable">
            <div class="jackpot-display">
              <span>Infinity Jackpot</span>
              <strong id="jackpotDisplay">100d</strong>
            </div>
            <h2>Paytable</h2>
            <div class="pay-row" data-pay="infinity">
              <span>Match 3</span>
              <img src="assets/infinity-logo-symbol.png" alt="" />
              <strong id="jackpotText">Jackpot 100</strong>
            </div>
            <div class="pay-row" data-pay="seven">
              <span>Match 3</span>
              <img src="assets/seven.svg" alt="" />
              <strong id="sevenText">Raro 1000</strong>
            </div>
            <div class="pay-row" data-pay="diamond">
              <span>Match 3</span>
              <img src="assets/diamond.svg" alt="" />
              <strong id="diamondText">Diamond bonus</strong>
            </div>
            <p id="paytableHint">Centro e diagonali pagano. Il 7 paga raro.</p>
          </div>

          <div class="reel-zone">
            <span class="side-arrow left" aria-hidden="true"></span>
            <div class="center-line" aria-hidden="true"></div>
            <div class="payline diag-a" aria-hidden="true"></div>
            <div class="payline diag-b" aria-hidden="true"></div>
            <div class="reel-shine" aria-hidden="true"></div>
            <div class="reel reel-left" id="reel0"></div>
            <div class="reel reel-center" id="reel1"></div>
            <div class="reel reel-right" id="reel2"></div>
            <span class="side-arrow right" aria-hidden="true"></span>
          </div>

          <div class="meter-row">
            <div class="meter">
              <span>Diamanti</span>
              <strong><b id="balance">500</b>d</strong>
            </div>
            <div class="meter">
              <span>Bet</span>
              <strong><b id="currentBet">10</b>d</strong>
            </div>
            <div class="meter">
              <span>Last win</span>
              <strong><b id="lastWin">0</b>d</strong>
            </div>
            <div class="meter bonus-meter">
              <span>Free spins</span>
              <strong><b id="freeSpins">0</b></strong>
            </div>
          </div>

          <div class="button-row">
            <button class="round-button spin" type="button" id="playButton" aria-label="Avvia spin">
              <span>Stop</span>
              <strong>Spin</strong>
            </button>
            <button class="round-button bet" type="button" id="betOne" aria-label="Cambia puntata">
              <span>Bet</span>
              <strong>One</strong>
            </button>
            <button class="round-button max" type="button" id="maxBet" aria-label="Imposta puntata massima 50">
              <span>Max</span>
              <strong>Bet</strong>
            </button>
            <button class="round-button auto" type="button" id="autoSpin" aria-label="Avvia autogiri">
              <span>Auto</span>
              <strong>Spin</strong>
            </button>
          </div>

          <div class="message-strip" id="message" aria-live="polite">Good luck, Habbo.</div>
          <div class="jackpot-banner" id="jackpotBanner" aria-hidden="true">Jackpot</div>
          <div class="bonus-banner" id="bonusBanner" aria-hidden="true">Free Spins</div>
          <div class="bonus-total" id="bonusTotal" aria-live="polite" aria-hidden="true">
            <span>Bonus win</span>
            <strong><b id="bonusTotalAmount">0</b> diamanti</strong>
          </div>
        </section>
        <button class="sound-toggle active floating-sound" type="button" id="soundToggle">Sound</button>
    </main>

    <script src="script.js?v=server-ready-1"></script>
  </body>
</html>
