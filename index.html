<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Infinity Slots</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="client" aria-label="Infinity Slots">
      <header class="client-top">
        <div class="hotel-badge">INFINITY</div>
        <nav aria-label="Client navigation">
          <span>Hotel</span>
          <span>Shop</span>
          <span>Home</span>
        </nav>
        <div class="player-box">
          <span>RetroPlayer</span>
          <strong id="topBalance">500</strong>
        </div>
      </header>

      <section class="room">
        <div class="room-floor" aria-hidden="true">
          <span class="furni sofa"></span>
          <span class="furni table"></span>
          <span class="furni plant"></span>
          <span class="furni arcade"></span>
          <span class="avatar one"></span>
          <span class="avatar two"></span>
        </div>

        <section class="slot-cabinet" id="slotMachine" aria-label="Infinity slot machine">
          <div class="cabinet-glow" aria-hidden="true"></div>

          <div class="slot-title">
            <span>Infinity</span>
            <img src="assets/infinity-logo-symbol.png" alt="Infinity" />
            <strong>Slots</strong>
          </div>

          <div class="paytable">
            <h2>Paytable</h2>
            <div class="pay-row">
              <span>Match 3</span>
              <img src="assets/infinity-logo-symbol.png" alt="" />
              <strong id="jackpotText">Jackpot 100</strong>
            </div>
            <div class="pay-row">
              <span>Match 3</span>
              <img src="assets/diamond.svg" alt="" />
              <strong>Diamond bonus</strong>
            </div>
            <div class="pay-row">
              <span>Match 3</span>
              <img src="assets/duck.svg" alt="" />
              <strong>Duck prize</strong>
            </div>
            <p>3 logo Infinity sulla linea centrale vincono.</p>
          </div>

          <div class="reel-zone">
            <button class="side-arrow left" type="button" aria-label="Decorazione sinistra"></button>
            <div class="center-line" aria-hidden="true"></div>
            <div class="reel" id="reel0"></div>
            <div class="reel" id="reel1"></div>
            <div class="reel" id="reel2"></div>
            <button class="side-arrow right" type="button" aria-label="Decorazione destra"></button>
          </div>

          <div class="meter-row">
            <div class="meter">
              <span>Credits</span>
              <strong><b id="balance">500</b>c</strong>
            </div>
            <div class="meter">
              <span>Bet</span>
              <strong><b id="currentBet">10</b>c</strong>
            </div>
            <div class="meter">
              <span>Last win</span>
              <strong><b id="lastWin">0</b>c</strong>
            </div>
          </div>

          <div class="button-row">
            <button class="round-button spin" type="button" id="playButton">
              <span>Stop</span>
              <strong>Spin</strong>
            </button>
            <button class="round-button bet" type="button" id="betOne">
              <span>Bet</span>
              <strong>One</strong>
            </button>
            <button class="round-button max" type="button" id="maxBet">
              <span>Max</span>
              <strong>Bet</strong>
            </button>
          </div>

          <div class="message-strip" id="message" aria-live="polite">Good luck, Habbo.</div>
        </section>
      </section>

      <footer class="client-bottom">
        <div class="dock-icons" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span>
        </div>
        <div class="chat-box">Spin to win</div>
        <button class="sound-toggle active" type="button" id="soundToggle">Sound</button>
      </footer>
    </main>

    <script src="script.js"></script>
  </body>
</html>
